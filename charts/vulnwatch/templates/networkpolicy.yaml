{{- if .Values.networkPolicy.enabled }}
{{- $cilium := .Values.networkPolicy.cilium.enabled }}
# vulnwatch only makes outbound requests: DNS, HTTPS to advisory sources,
# Claude, Slack and chart repositories, the Pushgateway and, with
# trivy.enabled, the Kubernetes API. With networkPolicy.cilium every rule
# here has a destination: Cilium adds up both policies, and a rule without
# one would open its ports to any address next to the host name list.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vulnwatch.fullname" . }}
  labels:
    {{- include "vulnwatch.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vulnwatch.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    {{- if or $cilium .Values.networkPolicy.pinDNS }}
    - to:
        {{- toYaml .Values.networkPolicy.dnsPeers | nindent 8 }}
      ports:
    {{- else }}
    - ports:
    {{- end }}
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    {{- if not $cilium }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            {{- with .Values.networkPolicy.internetExcept }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
      ports:
        - { port: 443, protocol: TCP }
    {{- if .Values.trivy.enabled }}
    # The Kubernetes API, for trivy-operator's reports (with Cilium: the
    # kube-apiserver entity in the CiliumNetworkPolicy).
    - ports:
        {{- range .Values.networkPolicy.apiServerPorts }}
        - { port: {{ . }}, protocol: TCP }
        {{- end }}
    {{- end }}
    {{- end }}
    {{- if .Values.metrics.pushgateway.url }}
    - to:
        {{- with .Values.networkPolicy.pushgatewayNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- else }}
        - namespaceSelector: {}
        {{- end }}
          {{- with .Values.networkPolicy.pushgatewayPodLabels }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - { port: {{ .Values.networkPolicy.pushgatewayPort }}, protocol: TCP }
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
