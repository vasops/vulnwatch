{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vulnwatch.serviceAccountName" . }}
  labels:
    {{- include "vulnwatch.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Pods mount the token only with trivy.enabled (to read trivy-operator's reports).
automountServiceAccountToken: false
{{- end }}
