{{- if .Values.trivy.enabled }}
# Read-only access to trivy-operator's VulnerabilityReports (sources.trivy).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "vulnwatch.fullname" . }}-trivy-reader
  labels:
    {{- include "vulnwatch.labels" . | nindent 4 }}
rules:
  - apiGroups: [aquasecurity.github.io]
    resources: [vulnerabilityreports]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "vulnwatch.fullname" . }}-trivy-reader
  labels:
    {{- include "vulnwatch.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "vulnwatch.fullname" . }}-trivy-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "vulnwatch.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
