{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
# For trying the chart out. In production prefer secrets.existingSecret
# (e.g. managed by External Secrets) so tokens never live in Helm values.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vulnwatch.fullname" . }}
  labels:
    {{- include "vulnwatch.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.values }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
