# vulnwatch sources file: WHERE to look. Only `sources` (advisory source
# endpoints and limits), `catalog` (where to look per product) and
# `helm_charts` (which products a chart deploys) belong here. Everything else
# (HTTP client, run, triage, outputs, product defaults) is in config.yaml;
# vulnwatch rejects a key that is in the wrong file.
#
# Required input (--sources / VULNWATCH_SOURCES, default ./sources.yaml).
# Nothing is built into the binary. Copy this file and adapt it.
#
# --sources can be repeated (VULNWATCH_SOURCES takes a comma-separated list).
# Later files are deep-merged on top of earlier ones, see sources-override.yaml:
#   - maps merge key by key (later file wins)
#   - lists REPLACE the earlier list (they are not appended)
#   - any source or catalog product can be switched off with `enabled: false`
#
# Every catalog selector is marked [v] = verified against the live source on
# 2026-10-12, 2026-10-27 or 2026-11-04:
#   ghsa: the repo publishes repository-level GitHub security advisories
#   osv:  the package query returns advisories
#   nvd:  the CPE match string (virtualMatchString) matches CVEs
#   rss:  the feed is reachable and still updated
# [r] = the GitHub repo exists but has published no advisories yet; it is
# kept so the first one is caught. Products with only [r] selectors have no
# advisory history anywhere (checked GHSA, OSV and NVD).

version: 1

# ---------------------------------------------------------------------------
# Global sources: one definition each, shared by all products.
# Secrets are never stored here, only the NAME of the env var that holds them.
# ---------------------------------------------------------------------------
sources:
  ghsa:
    enabled: true
    base_url: https://api.github.com
    token_env: GITHUB_TOKEN
    api_version: "2022-11-28"   # X-GitHub-Api-Version header
    per_page: 100
    detail_url: https://github.com/advisories/{id}   # report link; {id} = GHSA ID
    # Repository-level advisories only. Package-level GHSA advisories are
    # already covered by OSV, which imports the GitHub Advisory Database.

  osv:
    enabled: true
    base_url: https://api.osv.dev/v1

  nvd:
    enabled: true
    base_url: https://services.nvd.nist.gov/rest/json/cves/2.0
    api_key_env: NVD_API_KEY
    # NVD throttles hard without a key; space requests accordingly.
    request_interval: 6s
    request_interval_with_key: 1s
    max_window: 120d            # NVD rejects longer modified-date windows
    results_per_page: 2000
    detail_url: https://nvd.nist.gov/vuln/detail/{id}   # report link; {id} = CVE ID
    max_in_flight: 2            # requests at once, retries included: NVD turns parallel ones away with 503
    timeout: 90s                # per request: a busy NVD takes up to a minute to answer
    budget: 10m                 # NVD time per run; what is left is asked next run (below run.deadline)

  # CVE records from the CVE program (cvelistV5), with CISA's Vulnrichment
  # (CVSS, CPEs, SSVC) inside: the CNA's own affected versions from day 0.
  # The first run reads the full list (~660 MB download) into a match index
  # in the state DB; later runs read the daily change archives.
  cvelist:
    enabled: true
    releases_url: https://api.github.com/repos/CVEProject/cvelistV5/releases
    records_url: https://raw.githubusercontent.com/CVEProject/cvelistV5/main/cves
    work_dir: ""                # downloads during a run; empty: $TMPDIR/vulnwatch-cvelist
    token_env: GITHUB_TOKEN     # optional; only for listing releases

  rss:
    enabled: true

  # `vulnwatch news` (the chart's news CronJob, hourly): security news where
  # the vulnerabilities everyone talks about show up, often before an
  # advisory names a product. Each new item is posted once to the news
  # channel, with the stack products its title names; not matched by version.
  # A feed read for the first time is only remembered. Feeds are keyed by
  # name: renaming one posts nothing and forgets what it posted.
  news:
    enabled: true
    feeds:
      # A few bulletins a year, only for the flaws with industry-wide impact
      # (Log4Shell, regreSSHion, XZ, Java4Shell). No feed: the list page.
      - name: Red Hat Security Bulletins
        url: https://access.redhat.com/security/vulnerabilities
        format: rhsb
      # CERT-EU's advisories: two or three a month, only for critical and
      # high-impact flaws (Java4Shell, NetScaler, GitLab). Not CISA's alerts:
      # cisa.gov answers cloud IPs with HTTP 403.
      - name: CERT-EU Security Advisories
        url: https://cert.europa.eu/publications/security-advisories-rss
        format: rss

  kubernetes_cve_feed:
    enabled: true
    url: https://kubernetes.io/docs/reference/issues-security/official-cve-feed/index.json
    # Findings from this feed are attributed to these catalog products.
    products: [kubernetes, rke2]

  kev:                          # enrichment only
    enabled: true
    # CISA's own GitHub copy, updated daily; cisa.gov blocks many cloud IPs (HTTP 403).
    url: https://raw.githubusercontent.com/cisagov/kev-data/develop/known_exploited_vulnerabilities.json
    cache_ttl: 12h

  epss:                         # enrichment only
    enabled: true
    base_url: https://api.first.org/data/v1/epss
    batch_size: 100

  # Red Hat's rating and statement (e.g. "only servers with HTTP/2 enabled are
  # affected") for CVEs already found; context for triage and the P1 card.
  redhat:                       # enrichment only
    enabled: true
    base_url: https://access.redhat.com/hydra/rest/securitydata
    batch_size: 50
    max_details: 100            # statements fetched per run, KEV and EPSS first

  # The nodes' kernel (os: in stack.yaml) in the distribution's security
  # tracker (Debian, Ubuntu), queried through OSV with the running versions.
  # The tracker lists hundreds of kernel fixes per release, so a fix is only
  # reported when it is KEV-listed or has EPSS >= min_epss.
  os:
    enabled: true
    min_epss: 0.1

  # Vulnerable packages trivy-operator found in the running images, attached
  # to products by the catalog's images. Works only inside the cluster: the
  # Helm chart's trivy.enabled turns it on and grants read access to the
  # VulnerabilityReports.
  trivy:
    enabled: false
    # Image findings without an advisory for the product are noisy. They are
    # reported only with a fixed package version AND one of: KEV-listed,
    # EPSS >= min_epss, severity >= min_severity (min_severity_internet for
    # internet-facing products). Findings an advisory also reports are always
    # kept: Trivy then confirms the vulnerable code runs.
    min_severity: critical
    min_severity_internet: high
    min_epss: 0.1

# ---------------------------------------------------------------------------
# Product catalog: where to look for each product.
# Keys are the names used in stack.yaml. OSV ecosystem names follow OSV
# spelling (Go, Maven, PyPI, Packagist). images are the product's container
# image repositories; `vulnwatch stack discover` maps running images to
# products with them (any registry, and mirrors that prefix the path).
# cvelist are the vendor/product names CNAs write in cvelistV5 records
# (containers.cna.affected[]), matched case-insensitively; downstream
# rebuilds with their own versions (Red Hat build of Keycloak, Enterprise
# editions) are left out on purpose.
# ---------------------------------------------------------------------------
catalog:

  kubernetes:
    aliases: [k8s]
    ghsa: []                                   # kubernetes/kubernetes publishes no repo advisories; covered by kubernetes_cve_feed
    osv:
      - { ecosystem: Go, package: k8s.io/kubernetes }               # [v] 87 advisories
    nvd: ["cpe:2.3:a:kubernetes:kubernetes"]                        # [v] 61 CVEs
    cvelist:                                                        # [v] 63 records
      - { vendor: "Kubernetes", product: "Kubernetes" }             # 54
      - { vendor: "Kubernetes", product: "kubelet" }                # 7
      - { vendor: "Kubernetes", product: "kube-apiserver" }         # 2
    rss: []
    images:
      - rancher/hardened-kubernetes
      - registry.k8s.io/kube-apiserver
      - registry.k8s.io/kube-controller-manager
      - registry.k8s.io/kube-scheduler
      - registry.k8s.io/kube-proxy

  rke2:
    aliases: [rancher-rke2]
    ghsa: [rancher/rke2]                                            # [v]
    osv:
      - { ecosystem: Go, package: github.com/rancher/rke2 }         # [v] 3 advisories
    nvd: ["cpe:2.3:a:suse:rancher_rke2"]                            # [v] 2 CVEs (cpe:2.3:a:rancher:rke2 matches none)
    cvelist: [{vendor: "SUSE", product: "RKE2"}]                    # [v] 1 record
    rss: []

  containerd:
    aliases: []                                                     # the nodes' container runtime (rke2 and k3s ship it as v2.x.y-k3s1)
    ghsa: [containerd/containerd]                                   # [v] 33 advisories
    osv:
      - { ecosystem: Go, package: github.com/containerd/containerd }     # [v] 49 advisories
      - { ecosystem: Go, package: github.com/containerd/containerd/v2 }  # [v] 30 advisories
    nvd: ["cpe:2.3:a:linuxfoundation:containerd"]                   # [v] 22 CVEs
    cvelist: [{vendor: "containerd", product: "containerd"}]        # [v] 26 records
    rss: []

  longhorn:
    aliases: []
    ghsa: [longhorn/longhorn]                                       # [v]
    osv: []                                                         # longhorn-manager and longhorn return no OSV advisories
    nvd: ["cpe:2.3:a:linuxfoundation:longhorn"]                     # [v] 2 CVEs (not in the CPE dictionary; matched by virtualMatchString)
    cvelist: [{vendor: "SUSE", product: "Longhorn"}]                # [v] 2 records
    rss: []
    images:
      - longhornio/longhorn-manager
      - longhornio/longhorn-engine
      - longhornio/longhorn-instance-manager
      - longhornio/longhorn-share-manager
      - longhornio/longhorn-ui

  argocd:
    aliases: [argo-cd, argo]
    ghsa: [argoproj/argo-cd]                                        # [v]
    osv:
      - { ecosystem: Go, package: github.com/argoproj/argo-cd/v2 }  # [v] 83 advisories
      - { ecosystem: Go, package: github.com/argoproj/argo-cd/v3 }  # [v] 19 advisories
    nvd: ["cpe:2.3:a:linuxfoundation:argo-cd"]                      # [v] 3 CVEs
    cvelist:                                                        # [v] 51 records
      - { vendor: "argoproj", product: "argo-cd" }                  # 49
      - { vendor: "n/a", product: "ArgoCD" }                        # 2
    rss: []
    images: [quay.io/argoproj/argocd]

  gitlab-ce:
    aliases: [gitlab]
    ghsa: []                                                        # GitLab is not hosted on GitHub
    osv: []
    nvd: ["cpe:2.3:a:gitlab:gitlab:*:*:*:*:community:*:*:*"]       # [v] 1155 CVEs
    cvelist:                                                        # [v] 1162 records; GitLab's CNA names CE and EE alike, so EE-only issues match too
      - { vendor: "GitLab", product: "GitLab" }                     # 1112
      - { vendor: "GitLab", product: "GitLab CE/EE" }               # 22
      - { vendor: "GitLab", product: "GitLab Community and Enterprise Editions" }  # 13
      - { vendor: "GitLab", product: "GitLab Community Edition" }   # 2
      - { vendor: "n/a", product: "GitLab CE/EE" }                  # 9
      - { vendor: "n/a", product: "GitLab" }                        # 6
    rss:
      - https://docs.gitlab.com/releases/patch-releases.xml         # [v] canonical feed; about.gitlab.com/security-releases.xml redirects here
    images: [gitlab/gitlab-ce]
    # Also evaluate gitlab-org/advisories-community as a structured source (v2).

  gitlab-ee:
    aliases: []                                                     # the Enterprise Edition: GitLab CE plus the paid features, versioned alike
    ghsa: []                                                        # GitLab is not hosted on GitHub
    osv: []
    nvd: ["cpe:2.3:a:gitlab:gitlab:*:*:*:*:enterprise:*:*:*"]      # [v] 1421 CVEs (1180 of community, 245 EE-only)
    cvelist:                                                        # [v] gitlab-ce's names (CE issues are in EE too) and the EE-only ones; checked 2026-11-18 on cveawg.mitre.org records
      - { vendor: "GitLab", product: "GitLab" }
      - { vendor: "GitLab", product: "GitLab CE/EE" }
      - { vendor: "GitLab", product: "GitLab Community and Enterprise Editions" }
      - { vendor: "GitLab", product: "GitLab Community Edition" }
      - { vendor: "GitLab", product: "GitLab EE" }
      - { vendor: "GitLab", product: "GitLab Enterprise Edition" }
      - { vendor: "n/a", product: "GitLab CE/EE" }
      - { vendor: "n/a", product: "GitLab EE" }
      - { vendor: "n/a", product: "GitLab" }
    rss:
      - https://docs.gitlab.com/releases/patch-releases.xml         # [v] the same feed as gitlab-ce: patch releases fix both editions
    images: [gitlab/gitlab-ee]

  gitlab-runner:
    aliases: []                                                     # the CI runner (docker executor), versioned like GitLab
    ghsa: []                                                        # GitLab is not hosted on GitHub
    osv: []                                                         # no OSV package (checked 2026-11-07)
    nvd: ["cpe:2.3:a:gitlab:runner", "cpe:2.3:a:gitlab:gitlab_runner"]  # [v] 3 and 1 CVEs
    cvelist: [{vendor: "GitLab", product: "GitLab Runner"}]         # [v] 6 records
    rss: []                                                         # GitLab's patch-release feed is gitlab-ce's; here it would report every GitLab release
    images: [gitlab/gitlab-runner, gitlab-org/gitlab-runner]        # tags like alpine-v19.5.3 -> v19.5.3

  keycloak:
    aliases: [rh-keycloak]
    ghsa: [keycloak/keycloak]                                       # [v]
    osv:
      - { ecosystem: Maven, package: "org.keycloak:keycloak-services" }  # [v] 98 advisories
      - { ecosystem: Maven, package: "org.keycloak:keycloak-core" }      # [v] 50 advisories
    nvd: ["cpe:2.3:a:redhat:keycloak"]                              # [v] 99 CVEs
    cvelist:                                                        # [v] 81 records
      - { vendor: "Keycloak", product: "Keycloak" }                 # 15
      - { vendor: "Red Hat", product: "keycloak" }                  # 22
      - { vendor: "Red Hat, Inc.", product: "Keycloak" }            # 6
      - { vendor: "n/a", product: "Keycloak" }                      # 36
      - { vendor: "n/a", product: "keycloak-services" }             # 1
      - { vendor: "n/a", product: "keycloak-model-infinispan" }     # 1
    rss: []
    images:
      - quay.io/keycloak/keycloak
      - quay.io/keycloak/keycloak-operator
      - bitnami/keycloak
      - bitnamilegacy/keycloak

  openbao:
    aliases: [bao]
    ghsa: [openbao/openbao]                                         # [v]
    osv:
      - { ecosystem: Go, package: github.com/openbao/openbao }      # [v] 63 advisories
    nvd: ["cpe:2.3:a:openbao:openbao"]                              # [v] 25 CVEs
    cvelist: [{vendor: "openbao", product: "openbao"}]              # [v] 43 records
    rss: []
    images: [quay.io/openbao/openbao]

  vault:
    aliases: [hashicorp-vault]
    ghsa: []                                                        # hashicorp/vault publishes no repo advisories (HCSEC bulletins instead)
    osv:
      - { ecosystem: Go, package: github.com/hashicorp/vault }      # [v] 110 advisories (vault/api client module: none)
    nvd: ["cpe:2.3:a:hashicorp:vault"]                              # [v] 72 CVEs; matches Community and Enterprise editions
    cvelist: [{vendor: "HashiCorp", product: "Vault"}]              # [v] 43 records
    rss: []                                                         # discuss.hashicorp.com/c/security/52.rss covers all HashiCorp
                                                                    # products; without a keyword filter it would flood vault with noise
    images: [hashicorp/vault]

  litellm:
    aliases: [lite-llm]
    ghsa: [BerriAI/litellm]                                         # [v]
    osv:
      - { ecosystem: PyPI, package: litellm }                       # [v] 82 advisories
    nvd: ["cpe:2.3:a:litellm:litellm"]                              # [v] 37 CVEs
    cvelist:                                                        # [v] 47 records
      - { vendor: "BerriAI", product: "litellm" }                   # 31
      - { vendor: "berriai", product: "berriai/litellm" }           # 15
      - { vendor: "LiteLLM", product: "LiteLLM" }                   # 1
    rss: []
    images: [ghcr.io/berriai/litellm, ghcr.io/berriai/litellm-database]

  prometheus:
    aliases: []
    ghsa: [prometheus/prometheus]                                   # [v]
    osv:
      - { ecosystem: Go, package: github.com/prometheus/prometheus }  # [v] 9 advisories
    nvd: ["cpe:2.3:a:prometheus:prometheus"]                        # [v] 6 CVEs
    cvelist:                                                        # [v] 7 records
      - { vendor: "prometheus", product: "prometheus" }             # 6
      - { vendor: "[UNKNOWN]", product: "prometheus" }              # 1
    rss: []
    images: [quay.io/prometheus/prometheus]

  alertmanager:
    aliases: [prometheus-alertmanager]
    ghsa: [prometheus/alertmanager]                                 # [v]
    osv:
      - { ecosystem: Go, package: github.com/prometheus/alertmanager }  # [v] 2 advisories
    nvd: ["cpe:2.3:a:prometheus:alertmanager"]                      # [v] 1 CVE
    cvelist: [{vendor: "prometheus", product: "alertmanager"}]      # [v] 1 record
    rss: []
    images: [quay.io/prometheus/alertmanager]

  grafana:
    aliases: []
    ghsa: [grafana/grafana]                                         # [v] (last repo advisory 2023; OSV/NVD carry current data)
    osv:
      - { ecosystem: Go, package: github.com/grafana/grafana }      # [v] 113 advisories
    nvd: ["cpe:2.3:a:grafana:grafana"]                              # [v] 104 CVEs
    cvelist:                                                        # [v] 116 records
      - { vendor: "Grafana", product: "Grafana" }                   # 57
      - { vendor: "Grafana", product: "Grafana OSS" }               # 54
      - { vendor: "Grafana", product: "grafana/grafana" }           # 4
      - { vendor: "Grafana", product: "Grafana Alerting" }          # 1
    rss: []
    images: [grafana/grafana]

  grafana-alloy:
    aliases: [alloy]
    ghsa: []                                                        # grafana/alloy currently publishes no repo advisories
    osv:
      - { ecosystem: Go, package: github.com/grafana/alloy }        # [v] 2 advisories
    nvd: ["cpe:2.3:a:grafana:alloy"]                                # [v] 1 CVE
    cvelist: [{vendor: "Grafana", product: "Alloy"}]                # [v] 2 records
    rss: []
    images: [grafana/alloy]

  mariadb:
    aliases: [mariadb-galera, galera]
    ghsa: [MariaDB/server]                                          # [v]
    osv: []
    nvd: ["cpe:2.3:a:mariadb:mariadb"]                              # [v] 416 CVEs
    cvelist:                                                        # [v] 39 records
      - { vendor: "MariaDB", product: "server" }                    # 27
      - { vendor: "MariaDB", product: "MariaDB" }                   # 10
      - { vendor: "MariaDB Foundation", product: "MariaDB Server" }  # 1
      - { vendor: "n/a", product: "mariadb" }                       # 1
    rss: []
    images:
      - mariadb
      - bitnami/mariadb
      - bitnami/mariadb-galera
      - bitnamilegacy/mariadb
      - bitnamilegacy/mariadb-galera
    # Galera library itself is not covered yet; evaluate a CPE for it (v2).

  drupal:
    aliases: [drupal-core]
    ghsa: []                                                        # Drupal is not hosted on GitHub
    osv:
      - { ecosystem: Packagist, package: drupal/core }              # [v] 198 advisories
    nvd: ["cpe:2.3:a:drupal:drupal"]                                # [v] 734 CVEs
    cvelist:                                                        # [v] 81 records
      - { vendor: "Drupal", product: "Drupal Core" }                # 52
      - { vendor: "Drupal", product: "Core" }                       # 19
      - { vendor: "Drupal.org", product: "Drupal Core" }            # 8
      - { vendor: "Drupal.org", product: "Drupal" }                 # 1
      - { vendor: "drupal core", product: "drupal core" }           # 1
    rss:
      - https://www.drupal.org/security/rss.xml                     # [v] core advisories, latest item 2026-09-16
    # Contrib modules: add https://www.drupal.org/security/contrib/rss.xml
    # in a user override if you want them (noisy, mostly irrelevant).
    images: [drupal]

  netbird:
    aliases: []
    ghsa: [netbirdio/netbird]                                       # [v]
    osv:
      - { ecosystem: Go, package: github.com/netbirdio/netbird }    # [v] 6 advisories
    nvd: []                                                         # no NetBird CPE in the NVD dictionary (2026-10-12)
    cvelist:                                                        # [v] 2 records
      - { vendor: "NetBird", product: "NetBird" }                   # 1
      - { vendor: "NetBird VPN", product: "NetBird" }               # 1
    rss: []
    images: [netbirdio/netbird, netbirdio/management, netbirdio/signal, netbirdio/relay]

  opensearch:
    aliases: []
    ghsa: [opensearch-project/OpenSearch]                           # [v]
    osv:
      - { ecosystem: Maven, package: "org.opensearch:opensearch" }  # [v] 1 advisory (sparse)
    nvd:
      - "cpe:2.3:a:amazon:opensearch"                               # [v] 11 CVEs
      - "cpe:2.3:a:linuxfoundation:opensearch"                      # [v] 1 CVE (newer CVEs use the LF vendor)
    cvelist:                                                        # [v] 7 records
      - { vendor: "opensearch-project", product: "OpenSearch" }     # 1
      - { vendor: "OpenSearch", product: "OpenSearch" }             # 2
      - { vendor: "LF Projects", product: "OpenSearch" }            # 1
      - { vendor: "Github", product: "OpenSearch" }                 # 3
    rss: []
    images: [opensearchproject/opensearch]
    # OpenSearch Dashboards and security plugin are separate repos; add in v2 if needed.

  # -------------------------------------------------------------------------
  # Added 2026-10-27. Versions in stack.yaml must be APP versions, not Helm
  # chart versions (e.g. the argo-cd chart 10.x ships Argo CD 3.x).
  # -------------------------------------------------------------------------

  # --- Kubernetes platform -------------------------------------------------

  cilium:
    aliases: []
    ghsa: [cilium/cilium]                                           # [v] 44 advisories
    osv:
      - { ecosystem: Go, package: github.com/cilium/cilium }        # [v] 76 advisories
    nvd: ["cpe:2.3:a:cilium:cilium"]                                # [v] 35 CVEs
    cvelist: [{vendor: "cilium", product: "cilium"}]                # [v] 36 records
    rss: []
    images:
      - quay.io/cilium/cilium
      - quay.io/cilium/operator
      - quay.io/cilium/operator-generic
      - quay.io/cilium/hubble-relay
      - quay.io/cilium/clustermesh-apiserver
      - rancher/mirrored-cilium-cilium
      - rancher/mirrored-cilium-operator-generic
      - rancher/mirrored-cilium-hubble-relay

  envoy:
    aliases: [cilium-envoy, envoyproxy]                             # cilium-envoy tracks Envoy's version
    ghsa: [envoyproxy/envoy]                                        # [v] 100+ advisories
    osv:
      - { ecosystem: Go, package: github.com/envoyproxy/envoy }     # [v] 11 advisories (Envoy version ranges)
    nvd: ["cpe:2.3:a:envoyproxy:envoy"]                             # [v] 126 CVEs
    cvelist: [{vendor: "envoyproxy", product: "envoy"}]             # [v] 98 records
    rss: []
    images: [quay.io/cilium/cilium-envoy, rancher/mirrored-cilium-cilium-envoy, envoyproxy/envoy]

  cert-manager:
    aliases: [certmanager]
    ghsa: [cert-manager/cert-manager]                               # [v] 3 advisories
    osv:
      - { ecosystem: Go, package: github.com/cert-manager/cert-manager }  # [v] 4 advisories
    nvd: ["cpe:2.3:a:linuxfoundation:cert-manager"]                 # [v] 1 CVE
    cvelist: [{vendor: "cert-manager", product: "cert-manager"}]    # [v] 2 records
    rss: []
    images:
      - quay.io/jetstack/cert-manager-controller
      - quay.io/jetstack/cert-manager-webhook
      - quay.io/jetstack/cert-manager-cainjector
      - quay.io/jetstack/cert-manager-startupapicheck
      - quay.io/jetstack/cert-manager-acmesolver

  external-secrets:
    aliases: [eso, external-secrets-operator]
    ghsa: [external-secrets/external-secrets]                       # [v] 9 advisories
    osv:
      - { ecosystem: Go, package: github.com/external-secrets/external-secrets }  # [v] 12 advisories
    nvd: ["cpe:2.3:a:external-secrets:external_secrets_operator"]   # [v] 4 CVEs
    cvelist:                                                        # [v] 8 records
