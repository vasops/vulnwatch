    nvd: ["cpe:2.3:a:f5:nginx", "cpe:2.3:a:nginx:nginx"]            # [v] 41 and 2 CVEs (F5 took over the CPE)
    cvelist:                                                        # [v] 42 records
      - { vendor: "F5", product: "NGINX Open Source" }              # 35
      - { vendor: "F5", product: "NGINX" }                          # 2
      - { vendor: "nginx", product: "nginx" }                       # 2
      - { vendor: "[UNKNOWN]", product: "nginx" }                   # 3
    rss: []
    images: [nginx, nginxinc/nginx-unprivileged, bitnami/nginx]

  pgbouncer:
    aliases: []
    ghsa: []                                                        # pgbouncer/pgbouncer has no repository advisories
    osv: []
    nvd: ["cpe:2.3:a:pgbouncer:pgbouncer"]                          # [v] 10 CVEs
    cvelist: [{vendor: "n/a", product: "PgBouncer"}]                # [v] 13 records
    rss: []
    images: [cloudnative-pg/pgbouncer, bitnami/pgbouncer, edoburu/pgbouncer]

  haproxy:
    aliases: []                                                     # the load balancer, usually on VMs: list it in stack.yaml (discover only sees images)
    ghsa: []                                                        # haproxy/haproxy is a mirror of git.haproxy.org without repository advisories
    osv: []                                                         # C code: no OSV package
    nvd: ["cpe:2.3:a:haproxy:haproxy"]                              # [v] 36 CVEs (haproxy_enterprise and aloha are other products)
    cvelist:                                                        # [v] 16 records
      - { vendor: "HAProxy", product: "HAProxy" }                   # 9
      - { vendor: "HAProxy Technologies", product: "HAProxy" }      # 1
      - { vendor: "HAProxy Technologies", product: "HAProxy Community Edition" }  # 1
      - { vendor: "HAProxy Project", product: "HAProxy 2.6" }       # 1
      - { vendor: "HAProxy Project", product: "HAProxy 2.8" }       # 1
      - { vendor: "HAProxy Project", product: "HAProxy 2.9" }       # 1
      - { vendor: "HAProxy Project", product: "HAProxy 3.0" }       # 1
      - { vendor: "n/a", product: "HAProxy" }                       # 3
      - { vendor: "[UNKNOWN]", product: "haproxy" }                 # 1
    rss: []
    images: [haproxy, haproxytech/haproxy-alpine, haproxytech/haproxy-debian, haproxytech/haproxy-ubuntu]

  sentry:
    aliases: []                                                     # self-hosted Sentry (getsentry/self-hosted), calendar versions like 23.9.1
    ghsa: [getsentry/sentry]                                        # [v] 22 advisories (getsentry/self-hosted: 0)
    osv:
      - { ecosystem: PyPI, package: sentry }                        # [v] 30 advisories; PyPI stopped at 23.7.1, the ranges cover later releases
    nvd: ["cpe:2.3:a:sentry:sentry"]                                # [v] 16 CVEs (sentry_software_development_kit is the SDKs)
    cvelist:                                                        # [v] checked 2026-11-18 on 21 cveawg.mitre.org records
      - { vendor: "getsentry", product: "sentry" }                  # 20
      - { vendor: "Sentry", product: "Sentry" }                     # 1
    rss: []
    images: [getsentry/sentry, ghcr.io/getsentry/sentry]

  trivy:
    aliases: []                                                     # the scanner (trivy-operator's trivy-server and scan jobs)
    ghsa: [aquasecurity/trivy]                                      # [v] 5 advisories
    osv:
      - { ecosystem: Go, package: github.com/aquasecurity/trivy }   # [v] 10 advisories
    nvd: ["cpe:2.3:a:aquasec:trivy"]                                # [v] 3 CVEs
    cvelist:                                                        # [v] 6 records
      - { vendor: "aquasecurity", product: "trivy" }                # 5
      - { vendor: "aquasec", product: "Trivy" }                     # 1
    rss: []
    images: [aquasec/trivy, aquasecurity/trivy]

# ---------------------------------------------------------------------------
# Helm charts: which catalog products a chart deploys and where each
# version is read from. Used by the `helm:` list in stack.yaml.
#   appVersion                      Chart.yaml appVersion
#   chartVersion                    the chart version (charts that tag images with it)
#   {values: a.b.tag}               an image tag in the chart's values.yaml
#   {subchart: name}                appVersion of a bundled dependency
#   {subchart: name, values: a.b}   an image tag in a bundled dependency
# Image tags are cut to their leading version ("v3.9.1-distroless" -> v3.9.1).
# Keys are chart names (the same name in another repo maps the same way).
# ---------------------------------------------------------------------------
helm_charts:
  alloy:                            { grafana-alloy: appVersion }
  argo-cd:
    argocd: appVersion
    dex:    { values: dex.image.tag }
    redis:  { values: redis.image.tag }
  trivy-operator:                   { trivy: { values: trivy.image.tag } }  # trivy-operator itself has no advisory source
  cert-manager:                     { cert-manager: appVersion }
  cloudnative-pg:                   { cloudnative-pg: appVersion }
  plugin-barman-cloud:              { cnpg-barman-cloud: appVersion }
  dragonfly-operator:               { dragonfly-operator: appVersion }
  external-secrets:                 { external-secrets: appVersion }
  gatus:                            { gatus: appVersion }
  hcloud-cloud-controller-manager:  { hcloud-ccm: chartVersion }  # image tag is v{{ .Chart.Version }}
  hcloud-csi:                       { hcloud-csi: chartVersion }  # image tag is v{{ .Chart.Version }}
  loki:                             { loki: appVersion }
  promtail:                         { promtail: appVersion }
  prometheus-pushgateway:           { pushgateway: appVersion }
  vault:                            { vault: { values: server.image.tag } }
  openbao:                          { openbao: appVersion }
  harbor:                           { harbor: appVersion }
  longhorn:                         { longhorn: appVersion }
  litellm-helm:                     { litellm: appVersion }
  keycloak:                         { keycloak: appVersion }
  gha-runner-scale-set-controller:  { actions-runner-controller: appVersion }
  gha-runner-scale-set:             { actions-runner-controller: appVersion }
  minio:
    minio:    { values: image.tag }
    minio-mc: { values: mcImage.tag }
  gpu-operator:
    gpu-operator:             appVersion
    nvidia-container-toolkit: { values: toolkit.version }
  kube-prometheus-stack:
    prometheus-operator: appVersion
    prometheus:          { values: prometheus.prometheusSpec.image.tag }
    alertmanager:        { values: alertmanager.alertmanagerSpec.image.tag }
    grafana:             { subchart: grafana }
    kube-state-metrics:  { subchart: kube-state-metrics }
    node-exporter:       { subchart: prometheus-node-exporter }
  victoria-metrics-k8s-stack:
    victoria-metrics:          appVersion
    victoria-metrics-operator: { subchart: victoria-metrics-operator }
    grafana:                   { subchart: grafana }
    kube-state-metrics:        { subchart: kube-state-metrics }
    node-exporter:             { subchart: prometheus-node-exporter }
  # RKE2's bundled charts (https://github.com/rancher/rke2-charts), installed
  # as Helm releases in kube-system. Their appVersion lags the image RKE2
  # ships, so versions come from the image tags.
  rke2-cilium:
    cilium: { values: image.tag }
    envoy:  { values: envoy.image.tag }
  rke2-coredns:             { coredns: { values: image.tag } }
  rke2-ingress-nginx:       { ingress-nginx: { values: controller.image.tag } }
  rke2-traefik:             { traefik: { values: image.tag } }
  rke2-canal:
    calico:  { values: calico.nodeImage.tag }
    flannel: { values: flannel.image.tag }
  rke2-flannel:             { flannel: { values: flannel.image.tag } }
  rke2-snapshot-controller: { external-snapshotter: { values: controller.image.tag } }
  # Nothing to watch: CRDs and config objects, or software without any
  # advisory source (metrics-server, multus: see ignore_images).
  rke2-metrics-server:          {}
  rke2-multus:                  {}
  rke2-runtimeclasses:          {}
  rke2-snapshot-controller-crd: {}
  rke2-calico-crd:              {}
  rke2-canal-crd:               {}
  rke2-multus-crd:              {}
  rke2-traefik-crd:             {}
  rke2-gateway-api-crd:         {}

# ---------------------------------------------------------------------------
# Images not worth a catalog entry, by group: stack discover leaves them out
# of its "not in the catalog" notes and Trivy out of its unmatched images.
# Patterns match like catalog images (any registry, mirrors); "*" matches
# within one path segment, a final "**" everything below. Add your own
# images in a sources override (a new group); drop a group with [].
# Trivy still scans these images; vulnwatch just can't match advisories to
# them.
# ---------------------------------------------------------------------------
ignore_images:
  # Small helpers of a watched product; their advisories (rare) land on it.
  prometheus-helpers: [prometheus-operator/prometheus-config-reloader]
  cilium-helpers:
    - cilium/hubble-ui*
    - cilium/certgen
    - rancher/mirrored-cilium-hubble-ui*
    - rancher/mirrored-cilium-certgen
    - rancher/hardened-cni-plugins                                  # CNI plugins in the cilium DaemonSet
  sidecars:
    - kiwigrid/k8s-sidecar                                          # Grafana and Loki config reloader
    - brancz/kube-rbac-proxy                                        # metrics auth proxy
    - sig-storage/csi-*                                             # CSI driver sidecars
    - sig-storage/livenessprobe
    - aquasecurity/node-collector                                   # trivy-operator's node scan job
  # Software with no advisory in GHSA, OSV or NVD (checked 2026-11-06).
  no-advisory-source:
    - metrics-server/metrics-server
    - rancher/hardened-k8s-metrics-server
    - aquasec/trivy-operator
    - aquasecurity/trivy-operator
    - k8snetworkplumbingwg/multus-*
    - rancher/hardened-multus-*
    - rancher/hardened-dns-node-cache                               # node-local-dns (k8s-dns-node-cache)
    - dns/k8s-dns-node-cache
