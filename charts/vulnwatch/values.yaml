# Default values for vulnwatch. See values.schema.json for validation.

image:
  repository: ghcr.io/vasops/vulnwatch
  tag: ""                # defaults to the chart appVersion
  digest: ""             # sha256:… pins the image and wins over tag
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""
commonLabels: {}

# --- Schedule ---------------------------------------------------------------
schedule: "0 6 * * *"
timeZone: "Etc/UTC"      # IANA name, e.g. Europe/Prague
suspend: false
startingDeadlineSeconds: 3600
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3
# No retry by default: activeDeadlineSeconds covers every attempt, so a retry
# gets at most the 10m left after a 20m run.deadline. State is only written
# after all outputs succeed, so a failed run's findings are reported again by
# the next run (Slack delivery is at-least-once: some may arrive twice).
backoffLimit: 0
activeDeadlineSeconds: 1800   # keep above config run.deadline (20m by default)
ttlSecondsAfterFinished: 604800

run:
  # stdout, json, html, slack. json/html are written to the state volume
  # (/data/report.json, /data/report.html).
  outputs: [stdout]
  # debug | info | audit | warn | error. audit keeps only what vulnwatch
  # reported and sent (findings with priority, Slack messages, state written)
  # plus warnings and errors; info adds progress messages.
  logLevel: info
  logFormat: json        # json | text
  extraArgs: []

# One-off Job after `helm install`: checks every product against its full
# advisory history right away (no Claude, nothing reported as new). Optional:
# the first daily run does the same check by itself.
bootstrap:
  enabled: false
  outputs: [stdout]

# Security news (sources.news): a second CronJob runs `vulnwatch news` and
# posts each new Red Hat security bulletin or CERT-EU advisory once to the news
# channel (SLACK_NEWS_CHANNEL in env, else SLACK_CHANNEL), with the stack
# products its title names. Its first check only remembers what is there.
# It keeps what it posted on its own volume (persistence.storageClass and
# accessModes), so it never waits for the daily run's.
news:
  enabled: false
  schedule: "17 * * * *"
  outputs: [stdout, slack]
  # Post the newest N items of each feed again on every check, posted
  # before or not: to see the first messages in the channel. Set it back
  # to 0 afterwards, or each hourly check posts them again.
  repost: 0
  activeDeadlineSeconds: 600
  persistence:
    size: 1Gi            # some storage classes round up (hcloud: 10Gi)

# --- Configuration ------------------------------------------------------------
# stack.yaml: what you run. Required: either inline here (same format as
# examples/stack.yaml) or from a ConfigMap you manage (existingStackConfigMap).
stack: {}
#  defaults:
#    exposure: internal
#  helm:
#    - { repo: https://argoproj.github.io/argo-helm, chart: argo-cd, version: 10.9.2 }
#  products:
#    gitlab-ce: { version: "19.5.1", exposure: internet }

existingStackConfigMap:
  name: ""               # ConfigMap holding stack.yaml (instead of values.stack)
  key: stack.yaml

# The chart ships config.yaml and sources.yaml (copies of defaults/). These
# are layered on top, with the same rules (maps merge, lists replace) and the
# same separation: settings here, catalog/sources below.
configOverride: {}
#  triage:
#    enabled: false
#  run:
#    deadline: 20m

sourcesOverride: {}
#  catalog:
#    mariadb: { enabled: false }

# Image findings from trivy-operator in this cluster (sources.trivy): turns
# the source on, grants the service account read access to the
# VulnerabilityReports (ClusterRole) and mounts its token. Tune the filter
# with sourcesOverride.sources.trivy.
trivy:
  enabled: false

# Plain environment variables (not secrets), e.g. SLACK_CHANNEL, CLAUDE_MODEL.
env: {}
#  SLACK_CHANNEL: C0123456789
#  SLACK_ALERT_CHANNEL: C0987654321

# Single variables from Secret keys (any names you like).
secretEnv: {}
#  GITHUB_TOKEN: { name: github-readonly, key: token }
#  SLACK_BOT_TOKEN: { name: slack-vulnwatch, key: bot-token, optional: true }

# Whole Secrets as env vars (every key becomes a variable).
envFromSecrets: []
#  - vulnwatch-anthropic

# Raw envFrom entries (secretRef / configMapRef, prefix, optional).
envFrom: []
# Raw EnvVar entries.
extraEnv: []

secrets:
  # Secret whose keys become env vars. Expected keys (all optional):
  # ANTHROPIC_API_KEY, GITHUB_TOKEN, NVD_API_KEY, SLACK_BOT_TOKEN.
  # Recommended: manage it with External Secrets.
  existingSecret: ""
  # Or let the chart create it from values (testing only; tokens end up in Helm values).
  create: false
  values: {}

# --- Storage ----------------------------------------------------------------
# The SQLite state: what was reported, the chart cache, the KEV cache.
persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""       # "-" for the cluster default without a class
  accessModes: [ReadWriteOnce]
  size: 1Gi
  annotations: {}

# Scratch space at /tmp (TMPDIR), emptied after every run. The cvelist source
# downloads the full CVE list there on its first run (about 1.3 GB while it is
# read) and the daily change archives on later ones.
tmpDir:
  sizeLimit: 3Gi

# --- Metrics ------------------------------------------------------------------
metrics:
  # vulnwatch is a batch job: it pushes its metrics to a Pushgateway after
  # each run (dry runs excluded). Scrape the Pushgateway with honor_labels: true.
  pushgateway:
    url: ""              # e.g. http://prometheus-pushgateway.monitoring:9091
    job: vulnwatch
    grouping: {}         # e.g. {instance: prod}
  dashboard:
    enabled: false
    # Linked from the Slack run summary and P1 alerts ({from}/{to} become
    # now-30d/now, the last 30 days up to the click), e.g.
    # https://grafana.example.com/d/vulnwatch/vulnwatch?from={from}&to={to}
    url: ""
    namespace: ""        # where the Grafana sidecar looks; default: release namespace
    labels:
      grafana_dashboard: "1"
    annotations: {}      # e.g. grafana_folder: Security
  prometheusRule:
    enabled: false
    namespace: ""
    labels: {}           # e.g. release: kube-prometheus-stack (ruleSelector)
    additionalLabels: {} # added to every alert
    maxRunAgeHours: 26
    sourceFailingFor: 1d
    inventoryMaxAgeDays: 30  # alert when a stack's generated_at is older (stacks without one: no alert)
    findingAlerts: true  # alerts for open P1 and KEV-listed findings
    extraRules: []

# --- Pod --------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}
priorityClassName: ""
# Kernel isolation: e.g. gvisor (runsc) or kata, when the cluster has the
# RuntimeClass. vulnwatch only needs outbound HTTPS and a few files.
runtimeClassName: ""
# Landlock sandbox (VULNWATCH_LANDLOCK): require fails the run when the node
# can't apply it (no Landlock in the kernel, a seccomp profile or runtime that
# blocks it, e.g. gVisor); "true" then runs unrestricted with a warning;
# "false" turns it off.
landlock: require

# The image is distroless and runs as nonroot (65532).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  # RuntimeDefault, or a profile recorded with Security Profiles Operator:
  # { type: Localhost, localhostProfile: operator/vulnwatch/vulnwatch.json }
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop: [ALL]

# Large Helm repository indexes (e.g. Bitnami) are parsed in memory on the
# first download of a chart version; later runs use the cache.
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}

networkPolicy:
  enabled: false
  internetExcept: []     # CIDRs excluded from HTTPS egress, e.g. cluster ranges
  # DNS only to these peers. Always with cilium.enabled; without Cilium only
  # with pinDNS (a node-local DNS cache is not a pod: add an ipBlock for it).
  pinDNS: false
  dnsPeers:
    - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      podSelector: { matchLabels: { k8s-app: kube-dns } }
  pushgatewayPort: 9091
  # Where the in-cluster Pushgateway runs; empty: any pod in the cluster.
  pushgatewayNamespace: ""        # e.g. monitoring
  pushgatewayPodLabels: {}        # e.g. { app.kubernetes.io/name: prometheus-pushgateway }
  apiServerPorts: [443, 6443]   # with trivy.enabled: the API service port and the API server's own port
  extraEgress: []
  # Egress by host name instead of any HTTPS address (needs Cilium). The
  # NetworkPolicy above then has no rule without a destination (no 0.0.0.0/0
  # HTTPS, no open API server ports, DNS only to dnsPeers), since Cilium adds
  # up the allowances of every policy; the API server is allowed here by
  # entity. Rules in extraEgress count too. The repositories of the stack's Helm
  # charts are added from values.stack; with existingStackConfigMap list
  # them in extraFQDNs. Chart downloads that redirect elsewhere (an OCI
  # registry's blob storage, GitHub release assets) need their hosts too.
  cilium:
    enabled: false
    fqdns:
      - api.github.com                 # ghsa
      - api.osv.dev                    # osv, os
      - services.nvd.nist.gov          # nvd
      - raw.githubusercontent.com      # kev
      - api.first.org                  # epss
      - access.redhat.com              # redhat, news (security bulletins)
      - cert.europa.eu                 # news (CERT-EU advisories)
      - kubernetes.io                  # kubernetes_cve_feed
      - docs.gitlab.com                # rss
      - www.drupal.org                 # rss
      - api.anthropic.com              # triage
      - slack.com                      # slack
      - github.com                     # chart downloads from GitHub releases ...
      - "*.githubusercontent.com"      # ... redirect here
    extraFQDNs: []                     # e.g. your own sources, registries, Pushgateway outside the cluster
    dnsSelector:                       # the cluster DNS, whose answers Cilium learns the addresses from
      k8s:io.kubernetes.pod.namespace: kube-system
      k8s-app: kube-dns
